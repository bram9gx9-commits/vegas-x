games(r){
 const q=$('#gq',r),gs=$$('.g',r);let fav=0;
 const f=()=>{const v=q.value.trim().toLowerCase();let n=0;gs.forEach(g=>{const s=(!v||g.dataset.n.toLowerCase().includes(v))&&(!fav||g.dataset.fav);g.hidden=!s;n+=s});$('#gn',r).classList.toggle('hidden',n>0)};
 q.oninput=f;$('#gb',r).onchange=e=>{q.value=e.target.value;f()};
 $('#gf',r).onclick=e=>{fav=!fav;e.currentTarget.classList.toggle('text-rose-400',!!fav);f()};
 gs.forEach(g=>{g.onclick=()=>toast('Launching '+g.dataset.n+'…');$('.fav',g).onclick=e=>{e.stopPropagation();g.dataset.fav=g.dataset.fav?'':'1';$('svg',e.currentTarget).style.fill=g.dataset.fav?'#f43f5e':'none';f()}});
 $('#mkHome',r).onclick=()=>toast('Games set as your homepage','ok');
 $$('[data-v]',r).forEach(b=>b.onclick=()=>{$$('[data-v]',r).forEach(x=>{const a=x===b;x.classList.toggle('bg-emerald-500',a);x.classList.toggle('text-white',a);x.classList.toggle('bg-slate-800',!a);x.classList.toggle('text-gray-400',!a)});
  $('#gg',r).className='grid gap-2 sm:gap-3 '+(b.dataset.v==='a'?'grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7':'grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5')})},
tournaments(r){
 const g=$('#tg',r),q=$('#tq',r);let asc=1;
 const f=()=>{const v=q.value.trim().toLowerCase();let n=0;$$('.t',r).forEach(t=>{const s=!v||t.textContent.toLowerCase().includes(v);t.hidden=!s;n+=s});$('#tn',r).classList.toggle('hidden',n>0)};
 const sort=()=>{const k=$('#ts',r).value;const key=t=>k==='f'?+t.dataset.f:k==='p'?+t.dataset.p:+t.dataset.i;
  $$('.t',r).sort((a,b)=>(key(a)-key(b))*(asc?1:-1)).forEach(t=>g.append(t))};
 q.oninput=f;$('#ts',r).onchange=sort;$('#td',r).onclick=e=>{asc=!asc;e.currentTarget.title=asc?'Ascending':'Descending';e.currentTarget.style.transform=asc?'':'scaleY(-1)';sort()};
 $('input[type=checkbox]',r).onchange=()=>toast('No finished tournaments to show');
 $('#how',r).onclick=()=>toast('Play the tournament games, climb the leaderboard and win prizes!');
 $('#mine',r).onclick=()=>toast('You have not joined any tournaments yet');
 $$('.jn',r).forEach(b=>b.onclick=()=>{b.textContent='JOINED';b.disabled=true;b.classList.add('opacity-60');toast('You joined the tournament','ok')});
 $$('.tf',r).forEach(b=>b.onclick=()=>toast('This tournament is full','err'));
 $$('.vg',r).forEach(b=>b.onclick=()=>location.hash='#/slots')},
profile(r){
 $$('.tab',r).forEach(t=>t.onclick=()=>{const i=+t.dataset.tab;$$('.tab',r).forEach(x=>{const a=x===t;['bg-emerald-500/20','text-emerald-400','border-b-2','border-emerald-400'].forEach(c=>x.classList.toggle(c,a));['text-gray-400','bg-slate-800/50'].forEach(c=>x.classList.toggle(c,!a))});$('#p0',r).hidden=i===1;$('#p1',r).classList.toggle('hidden',i===0)});
 $('#rc',r).onclick=()=>navigator.clipboard?.writeText($('#rl',r).value).then(()=>toast('Referral link copied','ok'),()=>toast('Press Ctrl+C to copy'));
 let s={};try{s=JSON.parse(localStorage.getItem('vx_prefs')||'{}')}catch(e){}
 $$('[data-pref]',r).forEach(c=>{c.checked=!!s[c.dataset.pref];c.onchange=()=>{s[c.dataset.pref]=c.checked;try{localStorage.setItem('vx_prefs',JSON.stringify(s))}catch(e){}toast('Preference saved','ok')}});
 const em=$('#email',r),eb=$('#ef button',r),re=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
 em.oninput=()=>{const ok=re.test(em.value.trim());eb.disabled=!ok;em.classList.toggle('border-red-500',!!em.value&&!ok)};
 $('#ef',r).onsubmit=e=>{e.preventDefault();toast('Email saved successfully','ok')};
 $$('.eye',r).forEach(b=>b.onclick=()=>{const i=$('input',b.parentNode),h=i.type==='password';i.type=h?'text':'password';b.innerHTML=ic(h?'eyeoff':'eye');b.ariaLabel=h?'Hide password':'Show password'});
 $('#pf',r).onsubmit=e=>{e.preventDefault();const c=$('#currentPassword',r).value,n=$('#newPassword',r).value,k=$('#confirmPassword',r).value;
  if(!c)return toast('Enter your current password','err');if(n.length<6)return toast('New password must be at least 6 characters','err');if(n!==k)return toast('Passwords do not match','err');
  e.target.reset();toast('Password changed successfully','ok')}}
};

/* ---------- Router ---------- */
const R={'':'home','/':'home','/slots':'games','/bonuses':'bonuses','/vip':'vip','/tournaments':'tournaments','/profile':'profile'};
const menu=$('#menu'),setMenu=o=>{menu.classList.toggle('open',o);menu.style.maxHeight=o?menu.scrollHeight+'px':'0px'};
function route(){const n=R[location.hash.slice(1)]||'home',v=$('#v');v.innerHTML=pages[n]();init[n]&&init[n](v);document.title='VEGAS-X | '+n[0].toUpperCase()+n.slice(1);scrollTo(0,0);setMenu(false)}
addEventListener('hashchange',route);
$('#burger').onclick=()=>setMenu(!menu.classList.contains('open'));
$('#logout').onclick=()=>{if(confirm('Are you sure you want to log out?')){toast('Logged out successfully','ok');location.hash='#/'}};
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go}
 const t=e.target.closest('[data-toast]');if(t){e.preventDefault();toast(t.dataset.toast)}
 if(e.target.closest('footer a[href="#"]'))e.preventDefault();
 if(!e.target.closest('header'))setMenu(false)});
route();
})();
</script>
</body>
</html>
